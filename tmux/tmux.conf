set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Extended keys support for CSI u sequences (e.g., Shift+Enter from iTerm2)
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm-256color:extkeys'

source-file ~/dotfiles/tmux/tmux-keys.conf

set -g extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'
# Codex recognizes modified Enter in CSI-u form. Ghostty currently sends the
# older xterm modifyOtherKeys form, which tmux identifies as S-Enter.
bind-key -T root S-Enter send-keys Escape '[13;2u'
set -g mouse on

# Pane focus indicators (tokyo-night colors)
set -g pane-border-style fg=#3b4261
set -g pane-active-border-style fg=#9ece6a
set -g pane-border-lines heavy

# Subtle dimming for inactive panes (solarized dark backgrounds)
set -g window-style 'bg=#073642,fg=#586e75'
set -g window-active-style 'bg=#002b36,fg=#839496'

# Status bar styling (tokyo-night colors)
set -g status-style bg=#1a1b26,fg=#a9b1d6
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26] "
set -g status-right "#[fg=#7aa2f7]%H:%M #[fg=#565f89]%Y-%m-%d"
set -g status-left-length 30

# Window status styling
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "

# Message/command styling
set -g message-style bg=#1a1b26,fg=#c0caf5
set -g message-command-style bg=#1a1b26,fg=#c0caf5

set-option -g default-shell $SHELL

###########################################
# TPM Plugin Manager
# Need to clone TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# After changing to install you must press: prefix + I (capital i, as in Install) 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
